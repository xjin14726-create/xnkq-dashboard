  });
  const days=Math.max(1,Math.ceil((new Date(F.d2)-new Date(F.d1))/86400000)+1);
  const topP=Object.entries(pm).map(([k,v])=>({name:k.split('||')[0],dept:k.split('||')[1],count:v.count})).sort((x,y)=>y.count-x.count).slice(0,F.topN);
  const uDepts=Object.keys(dm).filter(k=>k&&k!=='未知'&&dm[k]>0).length;
  return {total,cm,dm,topP,days,uDepts};
}
function prevAgg(){
  const d1=new Date(F.d1),d2=new Date(F.d2);
  const ps=new Date(d1);ps.setMonth(ps.getMonth()-1);
  const pe=new Date(d2);pe.setMonth(pe.getMonth()-1);
  let total=0;eachDay(fmt(ps),fmt(pe),d=>{total+=(D.byDay[fmt(d)]||0);});
  return {total};
}
function pct(c,p){if(!p)return{cls:'neutral',txt:'N/A'};const v=((c-p)/p*100).toFixed(1);const n=parseFloat(v);return{cls:n>0?'positive':n<0?'negative':'neutral',txt:(n>0?'↑':n<0?'↓':'→')+' '+Math.abs(n)+'%'};}
function renderKPIs(a){
  const p=prevAgg();
  const r1=pct(a.total,p.total);
  const nChan=Object.keys(a.cm).filter(k=>a.cm[k]>0).length;
  const dailyAvg=Math.round(a.total/a.days);
  document.getElementById('kpis').innerHTML=
    '<div class="kpi"><div class="label">好评总数</div><div class="value">'+a.total.toLocaleString()+'</div><div class="comp '+r1.cls+'">'+r1.txt+'</div></div>'+
    '<div class="kpi"><div class="label">参与渠道数</div><div class="value">'+nChan+'</div><div class="comp neutral">筛选范围内</div></div>'+
    '<div class="kpi"><div class="label">日均好评数</div><div class="value">'+dailyAvg.toLocaleString()+'</div><div class="comp neutral">'+a.days+'天</div></div>'+
    '<div class="kpi"><div class="label">上期总数</div><div class="value">'+p.total.toLocaleString()+'</div><div class="comp neutral">对比基准</div></div>';
}
function renderLB(a){
  const s=a.topP;const tb=document.getElementById('lb');
  if(!s.length){tb.innerHTML='<tr><td colspan="4" style="text-align:center;padding:20px">暂无数据</td></tr>';return;}
  tb.innerHTML=s.map((e,i)=>{const rk=i+1;const bc=rk<=3?'r'+rk:'rank';const bs=rk<=3?'':'background:#4A6FA5;';const rd=rk===1?'🥇':rk===2?'🥈':rk===3?'🥉':rk;
    return '<tr class="tr"><td><span class="'+bc+'" style="'+bs+'">'+rd+'</span></td><td>'+e.name+'</td><td>'+e.dept+'</td><td style="font-family:Consolas,monospace;font-weight:600">'+e.count+'</td></tr>';}).join('');
}
function prorate(monthly){
  let t=0;
  eachDay(F.d1,F.d2,d=>{
    const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    t+=monthly/dim;
  });
  return Math.round(t);
}
function renderTG(a){
  const tgt={洁牙组:800,全科部:400,儿科:100,正畸科:200,"客户部-许燕青":200};
  const depts=Object.keys(tgt);
  document.getElementById('tg').innerHTML=depts.map(dept=>{
    const curr=a.dm[dept]||0;
    const t=prorate(tgt[dept]);const rate=t?((curr/t)*100).toFixed(1):'0.0';
    const prog=parseFloat(rate);const dev=(prog-100).toFixed(1);
    const cls=prog>=80?'p-high':prog>=50?'p-mid':'p-low';
    const alarm=prog<F.tp*0.8?'<span class="alarm a-hi">预警</span>':'';
    return '<tr class="tr"><td>'+dept+alarm+'</td><td style="font-family:Consolas,monospace">'+t.toLocaleString()+'</td><td style="font-family:Consolas,monospace">'+curr.toLocaleString()+'</td><td><div style="display:flex;align-items:center;gap:8px"><div class="prog-bg" style="flex:1"><div class="prog-fill '+cls+'" style="width:'+Math.min(prog,100)+'%"></div></div><span style="font-family:Consolas,monospace;font-weight:600">'+rate+'%</span></div></td><td style="color:'+(parseFloat(dev)>=0?'var(--suc-grn)':'var(--warn-red)')+';font-weight:600">'+(parseFloat(dev)>=0?'+':'')+dev+'%</td></tr>';
  }).join('');
}
function getChart(id){var el=document.getElementById(id);var c=echarts.getInstanceByDom(el);if(!c)c=echarts.init(el);return c;}
function initCharts(a){
  const dk=document.documentElement.getAttribute('data-theme')==='dark';
  const tc=dk?{bg:'#1e293b',t:'#64748b',s:'rgba(100,116,139,0.1)'}:{bg:'#ffffff',t:'#8a9bab',s:'rgba(0,0,0,0.04)'};
  const ac=Object.keys(a.cm).filter(k=>a.cm[k]>0).sort((x,y)=>a.cm[y]-a.cm[x]);
  const ad=Object.keys(a.dm).filter(d=>d&&d!=='未知'&&a.dm[d]>0).sort((x,y)=>a.dm[y]-a.dm[x]);
  getChart('ch1').setOption({tooltip:{trigger:'axis',backgroundColor:tc.bg,textStyle:{color:dk?'#e2e8f0':'#334455'}},grid:{left:'3%',right:'4%',bottom:'8%',top:'8%',containLabel:true},xAxis:{type:'category',data:ac,axisLabel:{color:tc.t,fontSize:10,rotate:15}},yAxis:{type:'value',axisLabel:{color:tc.t},splitLine:{lineStyle:{color:tc.s}}},series:[{type:'bar',data:ac.map(c=>a.cm[c]),label:{show:true,position:'top',color:tc.t,fontSize:10},itemStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#00B4D8'},{offset:1,color:'#0077B6'}]),borderRadius:[4,4,0,0]}}]},true);
  getChart('ch2').setOption({tooltip:{trigger:'axis',backgroundColor:tc.bg,textStyle:{color:dk?'#e2e8f0':'#334455'}},grid:{left:'3%',right:'4%',bottom:'8%',top:'8%',containLabel:true},xAxis:{type:'category',data:ad,axisLabel:{color:tc.t,fontSize:10,rotate:15}},yAxis:{type:'value',axisLabel:{color:tc.t},splitLine:{lineStyle:{color:tc.s}}},series:[{type:'bar',data:ad.map(d=>a.dm[d]),label:{show:true,position:'top',color:tc.t,fontSize:10},itemStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#FF6B6B'},{offset:1,color:'#FFA560'}]),borderRadius:[4,4,0,0]}}]},true);
  const labels=[],currA=[],prevA=[];
  eachDay(F.d1,F.d2,d=>{const ds=fmt(d);labels.push((d.getMonth()+1)+'/'+d.getDate());currA.push(D.byDay[ds]||0);const pd=new Date(d);pd.setMonth(pd.getMonth()-1);prevA.push(D.byDay[fmt(pd)]||0);});
  getChart('ch3').setOption({tooltip:{trigger:'axis',backgroundColor:tc.bg,textStyle:{color:dk?'#e2e8f0':'#334455'}},legend:{top:0,textStyle:{color:tc.t,fontSize:11},data:['本期','上月同期']},grid:{left:'3%',right:'4%',bottom:'8%',top:'14%',containLabel:true},xAxis:{type:'category',data:labels,axisLabel:{color:tc.t,fontSize:9,interval:Math.ceil(labels.length/12)}},yAxis:{type:'value',axisLabel:{color:tc.t},splitLine:{lineStyle:{color:tc.s}}},series:[{name:'本期',type:'line',data:currA,smooth:true,itemStyle:{color:'#00B4D8'},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(0,180,216,0.2)'},{offset:1,color:'rgba(0,180,216,0.02)'}])},lineStyle:{width:2}},{name:'上月同期',type:'line',data:prevA,smooth:true,itemStyle:{color:'#9B5DE5'},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(155,93,229,0.15)'},{offset:1,color:'rgba(155,93,229,0.01)'}])},lineStyle:{width:2,type:'dashed'}}]},true);
  const total=ac.reduce((s,c)=>s+a.cm[c],0);
  getChart('ch4').setOption({tooltip:{trigger:'item',backgroundColor:tc.bg,textStyle:{color:dk?'#e2e8f0':'#334455'}},legend:{bottom:0,textStyle:{color:tc.t,fontSize:11}},series:[{type:'pie',radius:['45%','70%'],data:ac.map(c=>({name:c,value:a.cm[c]})),label:{show:true,color:tc.t,fontSize:11,formatter:'{b}: {d}%'},itemStyle:{borderRadius:6,borderColor:tc.bg,borderWidth:3},color:['#00B4D8','#0077B6','#9B5DE5','#F15BB5','#FF6B6B','#FFA560']}]},true);
}
function renderAnalysis(a){
  const dm=a.dm,cm=a.cm;
  const depts=Object.entries(dm).filter(([k,v])=>v>0&&k!=='未知').sort((x,y)=>y[1]-x[1]);
  const chans=Object.entries(cm).filter(([k,v])=>v>0).sort((x,y)=>y[1]-x[1]);
  if(!depts.length||!chans.length){document.getElementById('analysis').innerHTML='';return;}
  const topD=depts[0],botD=depts[depts.length-1],avgD=Math.round(depts.reduce((s,d)=>s+d[1],0)/depts.length);
  const topC=chans[0],botC=chans[chans.length-1];
  const totalChan=chans.reduce((s,c)=>s+c[1],0);
  const tgt={洁牙组:800,全科部:400,儿科:100,正畸科:200,"客户部-许燕青":200};
  const lagDepts=Object.keys(tgt).filter(d=>(dm[d]||0)<prorate(tgt[d])*0.5).join('、');
  document.getElementById('analysis').innerHTML=
    '<div class="card"><h4>部门优劣势分析</h4>'+
    '<div class="inr pos"><span class="ic">+</span><span class="tx"><strong>'+topD[0]+'</strong> 好评数最高达 '+topD[1]+'，远超均值 '+avgD+'，领先优势显著</span></div>'+
    '<div class="inr neg"><span class="ic">−</span><span class="tx"><strong>'+botD[0]+'</strong> 好评数仅 '+botD[1]+'，低于均值，需重点加强</span></div>'+
    '<div class="inr warn"><span class="ic">!</span><span class="tx">全院均值 <strong>'+avgD+'</strong>，'+(lagDepts||'无')+(lagDepts?' 进度滞后':'部门均正常运行')+'</span></div>'+
    '</div>'+
    '<div class="card"><h4>渠道优劣势分析</h4>'+
    '<div class="inr pos"><span class="ic">+</span><span class="tx"><strong>'+topC[0]+'</strong> 占比 '+(topC[1]/totalChan*100).toFixed(1)+'%，贡献最大，主力获客渠道</span></div>'+
    '<div class="inr neg"><span class="ic">−</span><span class="tx"><strong>'+botC[0]+'</strong> 仅 '+(botC[1]/totalChan*100).toFixed(1)+'%，需优化渠道运营策略</span></div>'+
    '<div class="inr warn"><span class="ic">!</span><span class="tx">TOP1渠道占比 <strong>'+(topC[1]/totalChan*100).toFixed(1)+'%</strong>，'+(topC[1]/totalChan>0.5?'存在单渠道依赖风险':'渠道分布较均衡')+'</span></div>'+
    '</div>';
}
function refreshAll(){const a=agg();renderKPIs(a);renderLB(a);renderTG(a);initCharts(a);renderAnalysis(a);}
let dark=false;
function toggle(){dark=!dark;document.documentElement.setAttribute('data-theme',dark?'dark':'');document.querySelector('.theme-btn').textContent=dark?'切换浅色模式':'切换深色模式';setTimeout(refreshAll,100);}
document.getElementById('now').textContent=F.d1+' ~ '+F.d2;
document.getElementById('applyBtn').addEventListener('click',applyFilter);
refreshAll();

</script>
</body>
</html>
